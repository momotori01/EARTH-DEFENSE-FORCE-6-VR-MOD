; These two are now the sharpness control. The fit below takes its pixel
; density from them and then spends it only inside the lenses, so raising
; both by the same factor supersamples the visible image and raising them
; no longer wastes half of it on field of view nobody sees. Scale both
; together, keeping this 16:9 shape: it is wider than any headset needs, so
; the fit is what decides the final rectangle. Maximum 7680x4320.
ForceWidth=3840
ForceHeight=2160
; Fit the rendered width and height to the headset own field of view.
; Nothing else chooses that field: the vertical is asked of the runtime every
; frame and the horizontal is whatever the render rectangle aspect makes of
; it, so 16:9 of a 107 degree vertical is 135 degrees against a headset that
; shows 97. The pixel density is unchanged, so this is not a resolution cut:
; the same world at the same sharpness, minus the part outside the lenses.
; The size is locked before the renderer exists and the frusta are only
; knowable from a running session, so the first run with a headset measures
; it, saves it beside this file as EDF6VR.fit, and the next start uses it.
; Anything the file does not describe falls back to the size above -- wide,
; never narrow. A black edge means the file describes a different headset:
; restart once with this one and it corrects itself.
MatchHeadsetFov=1
; Degrees kept beyond what the runtime asks for, on all four sides.
HeadsetFovMarginDegrees=0.5
CapturePresent=1
MeasureWithoutVr=1
LimiterToggle=1
DescribeSwapChain=1
