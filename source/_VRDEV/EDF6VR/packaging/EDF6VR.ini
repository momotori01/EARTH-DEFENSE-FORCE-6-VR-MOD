; Where the support hand is expected to sit, in the firing hand's own frame.
; Measured from the palms, so a gunstock that holds both controllers on one
; rail reads straight ahead: sideways and height are 0. The old 0.05/-0.05
; came from measuring the aim poses instead, which sit out in front of each
; controller at its own angle. The TWOHAND and GRIP lines in the log report
; what your own rig reads if you want to set these from it.
TwoHandRightMetres=0.0
TwoHandUpMetres=0.0
; Take hold within this of where the support hand is expected, let go past the
; second. 0.20/0.26 took hold too far out; an INI still holding those is moved
; to these once.
TwoHandRadiusMetres=0.13
TwoHandLeaveRadiusMetres=0.23
TwoHandMinApartMetres=0.12
TwoHandSoftDegrees=55
TwoHandMaxDegrees=90
TwoHandSmoothing=0.35
; Sit the support hand on the barrel's own line instead of on the line between
; your hands. It solves for the aim that puts the weapon's sideways offset under
; that hand, and because the solution moves with the hand, the aim answers a
; nudge of the front hand with far less turn -- it feels like a dead spot around
; that hand. Off until that is sorted out; 1 restores the alignment.
TwoHandGripAlign=0
; Trim on where the support hand sits, in the firing hand's frame. With a
; gunstock both controllers are on one rail, so whatever the GRIP line in the
; log reports for right/up while firing is mounting slop: enter it negated and
; the barrel lines up with the rail.
TwoHandLeftRightMetres=0.0
TwoHandLeftUpMetres=0.0
TwoHandLeftAheadMetres=0.0
