; EDF6VR 1.1.0. See README_EDF6VR.txt.
; These are playable defaults, not the historical development INI.
; DepthProbe=1 is currently required by the render/UI capture path.
; NativeStereoProbe=0 disables the optional probe request, not native stereo.
; ReticleScale is live-reloaded; restart for other edits.


; ===== Left-handed mode =====
; LeftHanded=1: Rangers, Wing Divers and Air Raiders hold and fire the gun with the
; LEFT controller. The trigger, grip, buttons and sticks all change sides with it
; (move with the right stick, turn with the left). 0 = right-handed (default).
; Fencers and vehicles stay right-handed. Restart the game after changing.
; LeftHandedSticks=0 keeps the sticks where they are (move with the left stick).
[LeftHanded]
LeftHanded=0
LeftHandedSticks=1


; Which generation of settings this file holds. A file from before 2.0 (no
; Revision here) is replaced whole on the first start of 2.0 and kept beside
; it as EDF6VR.ini.v1.bak: the hands, the two-hand ranges and much else
; changed. The resolution set with Set_Resolution.bat is carried over.
; Leave this as it is.
[Settings]
Revision=2

[CameraTest]
StartEnabled=0
InitialYawDegrees=15
InitialPitchDegrees=0
DegreesPerSecond=30

[FirstPerson]
HeadRootLock=1
HeadSteady=0.85
HeadSteadyLimitMetres=0.15
HeadSteadySnapMetres=0.5
