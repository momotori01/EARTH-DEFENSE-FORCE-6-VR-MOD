HideBody=1
; 1 = the view turns with your body when it tips over: a Wing Diver's back-boost flip,
;     a roll, being swung by a red ant, a ragdoll fall. Strong motion, for players who
;     want to feel it. 0 = the view keeps level, as before (default).
ViewFollowsBody=0
HeadOffsetUp=0.15
FallbackEyeHeight=1.70

