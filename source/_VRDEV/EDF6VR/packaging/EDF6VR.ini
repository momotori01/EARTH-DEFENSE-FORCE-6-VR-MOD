StickFrame=1
; The Ranger's dash leaves along the body's facing, and the body faces the
; controller, so the run went wherever the weapon pointed. On, the soldier is
; turned to the head for the length of the dash, which puts the run where you
; are looking. What is drawn -- the weapon and the reticle -- keeps the
; controller's heading. 0 restores the old behaviour.
DashFollowsHead=1
ControllerAimBandDegrees=0.0
RoomScaleWalk=1
RoomScaleDeadZoneMetres=0.20
RoomScaleSettleSeconds=0
RoomScaleGain=1.0
RoomScaleMaxSpeed=4.0
HeadHeightCameraOnly=1
HeadHeightScale=1.0
MouseAdjustsYawOffset=1
PitchSign=0
RollSign=1
ShellCaseFollowsWeapon=1
; In a vehicle the game's camera frames the machine from behind and above, so
; it looks down at it. Once the eye has been moved into the cabin that pitch
; frames nothing and only leaves you facing the ground, so the view is
; levelled to the horizon; the heading and any slope roll are kept.
; VehicleLevelView=0 goes back to the native camera's own pitch.
VehicleLevelView=1
; In a vehicle the gun hand aims like the right stick, as if a laser pointer came
; out of the controller: point it above level and the aim goes up, to the left of
; the seat's front and it goes left. Only where it points counts, not where the
; controller is. On (1) or off (0) by kind of seat: the Nix (with the Gravis and
; the Combat Wagon), the Depth Crawler, the Barga, the tanks, the combat vehicles
; (Negling, Grape, Caliban), the helicopters, the gun seats (the Proteus's seats
; and the Titan's guns) and the Brute's door guns. Seats with no cockpit (bikes,
; trucks, the armed pickups) never use it. VehicleHandAimLevelDegrees is how far
; above the horizon your hand points when you hold it level. Within
; VehicleHandAimDeadzoneDegrees nothing moves; past that the push grows to full at
; VehicleHandAimFullDegrees. The controller hums at VehicleHandAimBuzz (0 = off)
; while it aims. The stick still works as well. All of these apply while playing.
VehicleHandAimNix=1
VehicleHandAimDepth=0
VehicleHandAimBarga=0
VehicleHandAimTank=1
VehicleHandAimCombat=1
VehicleHandAimHeli=1
VehicleHandAimGunner=1
VehicleHandAimBruteGunner=1
VehicleHandAimLevelDegrees=12
VehicleHandAimDeadzoneDegrees=10
VehicleHandAimFullDegrees=25
VehicleHandAimBuzz=0.03
; Scopes: while you zoom, the magnified picture is shown on the weapon (in its
; scope or screen, or on a small holographic monitor; the Fencer's is a panel in
; front of you) and the rest of the view keeps its normal size. ScopeMode=1
; draws the scope's own view (sharp; costs frame rate only while zoomed),
; ScopeMode=2 magnifies a part of the normal picture instead (no cost, but
; blurrier), ScopeMode=0 turns it off (the old whole-view zoom). ScopeLensScale
; makes the picture bigger or smaller (1 = the surface's own size). Both apply
; while playing.
ScopeMode=1
ScopeLensScale=1
; Lighter Kurul shots: the Kurul's shotgun pellets are drawn without the ring
; that swells around each one, which keeps big fights smooth in VR. The file is
; made from your own game files (Mods\OBJECT\E601_SHOTGUN.EFARC) by
; "EDF6 VR setting.exe" when it opens with the game closed; 0 undoes it there.
LightEnemyEffects=1
; Your own hands, cut from the soldier's model and drawn at the controllers.
; The fingers rest slightly curled; the grip closes the outer three and the
; thumb, the trigger closes the index finger. The trims move and turn the hand
; on the controller (metres and degrees, live-reloaded every few seconds).
; The values are for the right hand; the left hand is its mirror. These are
; the fallback; a [Hand.<controller>] section below overrides them.
; HandPalmInvert=1 if the palm faces the wrong way, HandCurlInvert=1 if the
; fingers bend backwards. HandPassMask names the render passes the hands are
; drawn in (bit per pass); HandModels=0 turns them off.
HandModels=1
HandRelaxed=0.15
HandRightMetres=0.0367
HandUpMetres=0.0129
HandAheadMetres=-0.0367
HandYawDegrees=4.47
HandPitchDegrees=-59.27
HandRollDegrees=3.61
HandPalmInvert=0
HandCurlInvert=0
HandPassMask=3
; Visual recoil. Each shot tilts the weapon and the hand up and back and the
; kick dies away over RecoilDecayMs; sustained fire keeps it going. The aim
; is not touched. RecoilKick=0 turns it off.
RecoilKick=1
RecoilPitchDegrees=4.0
RecoilBackMetres=0.05
RecoilDecayMs=80
; Vehicle weapons kick the same way, scaled to the machine: the Nix and Gravis
; arms from the shoulder and their shoulder launchers, the Depth Crawler's
; gatling and side mounts, and the 409/410 helicopters' own guns. Tanks and
; trucks already recoil and are left alone. Only shots fired while you hold a
; trigger or grip count, so teammates in the other seats do not shake it, and a
; helicopter's fuel (held as a weapon, always going down) is not taken for a gun.
; VehicleRecoilScale sizes it.
VehicleRecoil=1
VehicleRecoilScale=1.0
; Controller buzz for a shot the game gives no rumble to (the left gun of a
; dual wield). The game's own firing rumble goes to the hand that fired, or to
; both hands while the left hand steadies the weapon. 0 turns the extra off.
ShotBuzz=0.5
; Fencer: the left weapon aims with the left controller, the right with the
; right. The right hand is the game's own aim (its heaviness and recoil). The
; left gets a second aim driven the same way, with the same loadout coefficient
; and the left weapon's own recoil.
; FencerSplitAim=0 restores one aim for both weapons. FencerHeavyAim=0 lets the
; left follow the controller with no lag. FencerSwapHands=1 if the weapons come
; out in the wrong hands (the left trigger's weapon should follow the left hand).
FencerSplitAim=1
FencerHeavyAim=1
; 1: the weapons ride the controllers (shots and muzzle flash from the carried
; muzzle); 0: they stay on their mounts and only turn.
FencerHandWeapons=1
; Aim the barrel straight at the target instead of working out which of the
; model's axes answers to which of the aim's. The muzzle's offset from the
; weapon root is the barrel, stated by the game, so there is nothing to infer
; -- and nothing to get wrong the way the axis mapping did. Off until it has
; been seen on hardware; 1 tries it.
FencerDirectAim=1
; Carried weapons: where the weapon sits from each controller (metres; outward
; from the body for both hands, negative = inward; ahead along the aim; up), and
; whether the weapon rolls with the controller, with the aim's heaviness
; (0 = always upright). The Ranger's Weapon*Metres do not apply to the Fencer.
FencerHandOutwardMetres=0.05
FencerHandAheadMetres=-0.027
FencerHandUpMetres=0.022
FencerHandRoll=1
; Shoulder weapons pivot on the player's shoulders: the headset's eye position
; plus these offsets (metres: to the side, down, back) in the body's facing,
; which follows the head slowly. 0 leaves them on the game's own mount.
FencerShoulderOnHead=1
FencerShoulderSideMetres=0.40
FencerShoulderDownMetres=0.10
FencerShoulderBackMetres=0.25
FencerSwapHands=0

