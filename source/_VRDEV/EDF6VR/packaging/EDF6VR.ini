[Diagnostics]
; Place the player own sounds where they belong instead of where the game
; emits them. In VR the listener is the eye and the booster, footfalls, voice
; and gunfire are all emitted from the model he is standing inside, so their
; direction passes through him and inverts, which is heard as the sound
; tearing and arriving from one speaker. A shot goes where the tracked weapon
; was when it fired -- the firing hand, not always the right one. Anything
; else that happens at a place stays there. A voice that begins on the
; listener is heard from the ground beneath him, and once it proves to travel
; with him it moves to his back. Volume, pitch and voice lifetime are not
; touched, and 0 restores the game own placement everywhere.
SoundPositionFix=1
SoundPlaceVoices=1
; A voice beginning this soon after a shot, and this near the listener, is
; that shot.
SoundFireWindowMs=120
SoundCarriedMetres=2.0
; Wait this long before asking whether a voice is carried, and only ask once
; the listener has actually gone this far.
SoundCarriedAfterMs=150
SoundCarriedMoveMetres=0.20
; Where the two carried kinds belong against the head.
SoundUnderfootMetres=0.6
SoundFootDropMetres=1.7
SoundBackBehindMetres=0.35
SoundBackDownMetres=0.20
; A net under the above: a voice that keeps stepping further in one update
; than a source could travel stops being placed by angle at all.
SoundPanStepDegrees=25
SoundPanFlipDegrees=45
SoundPanFlipCount=4
; The distance fade the above replaced. It could not tell a sound that needs
; a direction from one that cannot have a sensible one; left off.
SoundNearFieldHoldMetres=0
SoundNearFieldFadeMetres=0
; Per-window SOUNDPOS/SOUNDLIFE research logging. Off for release.
SoundPositionTrace=0
; Writes every path EDFModLoader offers to the Mods folder to
; Mods\Plugins\EDF6VR.paths.txt. Only useful when working out what a texture or
; model pack can replace. Off for release.
ResourcePathLog=0
; How many runs EDF6VR.log keeps. It is appended to every start, so without
; this it grows for the life of the install. 0 keeps everything.
LogSessions=10
MotionTrace=0
MissionRequestPoints=0
; Solo test of the Proteus crew figure: while the other tandem seat (driver or
; missile seat) is empty, a soldier sits there. 1 Ranger, 2 Wing Diver, 3 Air
; Raider, 4 Fencer, 0 off. Look 0-3 (-1 your own), colour 0-11 (-1 the model's
; own, -2 your own). Changes apply while playing. A real player in that seat
; always shows instead, in their own look and colours.
CrewFigureTest=0
; Research: split the GPU's frame into model drawing and the rest (lighting,
; effects, post) with timestamps, per eye, into GPUSPLIT log lines. Off for play.
GpuSplit=0
CrewFigureTestLook=0
CrewFigureTestColour=-1
DepthProbe=1
; Currently also starts the title-screen VR bootstrap/watchdog. Keep enabled.
LogGamepad=1
; Development keys F2 F3 F4 F6 F7 F8 F10 (display force, window move, frame
; dump, camera tests, body visibility). 0 leaves them to other mods; F5, F9,
; F11 and F12 always work.
DevKeys=0
FiringPresentationTrace=0

