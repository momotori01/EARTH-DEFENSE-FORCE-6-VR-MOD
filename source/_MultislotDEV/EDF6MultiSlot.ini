[MultiSlot]
; 1 = on, 0 = off (the game is left completely untouched).
Enabled=1
; 8Player MOD - rooms you create as host. Switched on a menu screen outside a room and saved here; the
; lower left of the menu shows "F2/LS 8Player MOD :ON/OFF" where it can be switched:
;   0 = a normal 4-player room that anyone can find and join, exactly as without this mod.
;   1 = a MultiSlot room for 8 players. Players without this mod cannot see it, and are refused
;       if they try to join through an invite.
; A room keeps the setting it was created with. As a guest you can always join both kinds of room.
EightPlayerRooms=0
; What switches it. F1..F24, Tab, a virtual-key number, or None.
Key=F2
; And the pad button, so a VR controller can reach it. The left stick is free outside a room, which is the
; only place this can be switched. RightStick, LeftStick, Back, Start, X, Y, LB, RB, LT, RT or None.
PadButton=LeftStick
; 1 = write crash details (address and call stack) to EDF6MultiSlot.log.
CrashLog=1
; 1 = also write EDF6MultiSlot-crash.dmp for the first access violation inside the game's own code
;     (one per launch, the same file overwritten). Faults in other modules, and ones the game goes on to
;     handle, write nothing.
;     OFF by default, on purpose: a dump is a copy of the game's memory at that moment, so it can contain
;     the room name, player names and chat text. It never leaves your PC on its own, but it is only worth
;     creating if you have been asked for one. Turn it on when you are helping to chase a crash that the
;     log alone cannot explain - a null pointer whose source is on the stack is one of those.
CrashDump=0

[Sync]
; Measurement only, on by default, changes nothing about the game. Once a minute the log gets one line
; per direction saying how much the game sent and received, per channel, in kbps:
;     TRAFFIC sent over 60s: 284 kbps avg, busiest second 512 kbps (...), 1840 packets, ...
; EDF6 keeps its routine state sync under about 320 kbps and skips the less important updates as it
; approaches that, so a full room can lose updates without a single packet being lost on the network.
; An 8-player room carries up to 28 P2P links where 4 players carry 6, so this build pushes harder on
; that ceiling than the game was built for, and this line is how we find out by how much.
TrafficMeter=1

; EXPERIMENT, off by default. EDF6 hands every game packet to EOS as UnreliableUnordered: whatever is
; lost is simply gone, and the two machines carry on from different states. Turning this on asks EOS to
; resend the lost ones. Only the sender needs it - the other side acknowledges by itself, with or without
; the plugin.
; It is off because the trade is real and untested: a resent packet arrives after the packet that
; replaced it, and EDF6 applies what it receives in arrival order without checking which is newer, so a
; late position can drag a player backwards - the very jumping this is meant to stop. It also adds
; traffic, and see TrafficMeter above for why that is not free either.
; Worth trying as an A/B: play a mission with 1, the same with 0, and compare.
ReliableGameTraffic=0

; Measurement only, OFF by default because it hooks a function the game runs every frame for every
; player and writes one line a second while a mission is running. Turn it on when chasing the desync.
; Every class's per-frame sync keeps a smoothed copy of a remote player and moves it 5% of the way to
; the position that arrived over the network. 5% a frame is about a second to close, which is what
; "they land, then slide into place" looks like. The step the game takes is 5% of the gap, so reading
; that one field twice recovers the gap exactly - how far the player you are aiming at is from where
; they really are - and the position it is heading for, which gives their true speed:
;     DESYNC p1: gap avg 143 max 892, worst single correction 45, 61 updates/s, their own speed ...
; Nothing is written back to the game.
DesyncMeter=0

; EXPERIMENT, off by default, and the only setting in this section that writes to the game rather than
; reading it. Needs DesyncMeter=1 (it rides the same hook).
; Measured on 2026-09-30 with two players: when a remote player drifts further out of sync than EDF6
; tolerates, the game snaps them into place once and then LATCHES ITS OWN CORRECTION OFF. From then on
; that player is drawn purely from local guesswork - in a real session that lasted up to 89 seconds, and
; looks like someone walking on their screen while flying upward for ten seconds on yours.
; This puts the latch back to zero every frame, so the checker keeps correcting.
; Later the same day (1.5.30) the latch turned out to mean "caught up, waiting for the next position": it
; is also set when the player is within 0.1 of the last position that arrived, and every arriving position
; clears it. The long stretches were stretches with no position at all - see PositionEveryPacket below,
; which is the real fix. This stays off and is kept only for comparison.
ClearSyncLatch=0

; EXPERIMENT, off by default (0 = leave the game's own value). Needs DesyncMeter=1.
; EDF6 only smooths a remote player back into place while they are within about 20 game units of where
; they really are. Past that it gives up: one snap, then no correction at all (see ClearSyncLatch).
; Measured on 2026-09-30: with the latch cleared every frame it was thrown again every frame, because
; the error stayed above 20 the whole time - so the tolerance, not the latch, is what shuts it.
; This writes a larger tolerance, so the checker keeps smoothing instead of giving up. Try 100.
; Too large and a genuinely teleported player (a revive, a vehicle) will slide across the map instead of
; appearing where they are, so raise it only as far as it needs to go.
SyncTolerance=0

; ON by default (1.5.32). Only what this machine SENDS changes, so it helps the OTHER players see you:
; for everyone to see everyone, everyone needs it - which is why it is on for everyone. 0 = send it the
; way the game does.
; Measured on 2026-09-30: of the packets a remote player's machine sent, 15.5% carried their position,
; and for 24% of the seconds none did - they ran on this machine's guesswork in between, which is how a
; Wing Diver ends up 17 m from where she really stands. EDF6 means to send it ten times a second: it
; puts it in the packets of one frame in six. But a packet is built every frame and a 90 ms timer sends
; only the latest, which at 60 fps is also every sixth frame, so the frame that goes out stays at the
; same place in that cycle: the position goes out in every packet, or in none, for seconds on end.
; 1 = put it in every packet. Six bytes each, about half a kbps per player you play with. Vanilla sends
; exactly this whenever the cycle happens to line up, so every receiver reads it as usual, with or
; without this plugin.
; Tested on 2026-09-30 with both machines at 1: a flying Wing Diver drawn a median 0.24 m from where she
; really was (1.57 m before), and over 5 m for 0.4% of the time (14% before).
PositionEveryPacket=1

; ON by default (1.5.32). The same for which way you face: EDF6 sends it on the same one-frame-in-six
; cycle, three frames after the position, so the timer locks it out the same way - and before the fix
; above the two could never arrive together. Measured on 2026-09-30 with the position fixed: a Wing
; Diver's facing arrived in 11 seconds of 167 and she was drawn turned 100-130 degrees from where she
; faced for the whole session; her dashes then went off in that wrong direction until the next position
; pulled her back. 1 = put it in every packet. Also sender-side only, and also what vanilla sends
; whenever the cycle lines up. Tested on 2026-09-30 with both on: facing 0 degrees off in both directions,
; position 0.15-0.26 m. Together they add 3-5 kbps to each link.
FacingEveryPacket=1

[Smoothing]
; How much of the gap a remote player's drawn position closes each update, as a percentage. 0 = off.
; This was tested on 2026-09-29 and written off as useless. That verdict is withdrawn: the session it
; was measured in had EDF6's sync checker latched off for 76% of the time (see [Sync] ClearSyncLatch),
; so for three quarters of the test there was no correction for this fraction to act on. The conclusion
; was about a broken premise, not about the setting.
; With the latch cleared the correction runs almost all the time, and what is left is that it closes
; only 5% of the gap per frame - about a second to converge, which is the "it takes ages before they
; snap into place" that remains. This is the number that changes that.
; Higher means they track their real position sooner and jump about more. Worth an A/B: a mission at
; 20, the same at 0.
RemotePlayerPercent=0

[Update]
; 1 = when the game starts, ask GitHub once whether a newer EDF6VR package has been released, and if so
;     say so in the menu's text field:  NEW EDF6VR 2.0.1 -> 2.1.0 - Update_EDF6VR.bat
;     Nothing is downloaded and nothing is changed - it only reads the release page and tells you, so you
;     can close the game and run Update_EDF6VR.bat yourself. One request, on its own thread, and any
;     failure (offline, blocked, slow) simply shows nothing.
;     This is the only part of the mod that contacts anything outside the game. 0 = do not contact it.
CheckEDF6VR=1
; 1 = detailed diagnostic log for bug reports (default): lobby and P2P events (room capacity, search,
;     joins, EOS SDK messages) and enemy count scaling. 0 = only startup, menu and crash lines.
; EDF6MultiSlot.log keeps at most about 2 MB either way: past that its oldest lines are dropped.
NetLog=1
; Experimental: retry a final handshake reply once after NoConnection, allowing delivery after connect.
; Only with 5+ occupied user slots and a locally validated peer. Missing key defaults to 1.
; 0 disables the recovery completely on the next game start, independently of NetLog.
HandshakeRecovery=1

[RoomScreen]
; The room screen shows four members at a time; with more members, these switch pages (the lower left
; of the room screen then shows which keys, e.g. "F3/Tab/RS: Members 5-8").
; Pad button: RightStick, LeftStick, Back, Start, X, Y, LB, RB, LT, RT or None.
; (On the room screen LB/LT already scroll the chat log and RB/RT the mission text.)
PageButton=RightStick
; Keyboard keys, comma separated: F1..F24 (not F2, the 8Player MOD key), Tab, or virtual-key numbers.
PageKeys=F3,Tab
; Test mode, 1 = on: on the room screen DummyAddKey adds and DummyRemoveKey removes a fake member
; (a copy of the first one) in the room's own member list, so the member panels, the voice chat
; display and anything else that reads the members run with 5-8 members on one machine.
; Only your game sees them and nothing is sent online, but leave this off for normal play.
DummyMembers=0
DummyAddKey=F6
DummyRemoveKey=F7

[Mission]
; 1 = missions support players 5-8 (their loadouts, player objects, spawn points). With four or
; fewer players the game behaves exactly as without the mod. 0 = leave mission code untouched
; (then only rooms of up to four players can start a mission safely).
Extend=1
; Online missions with 5-8 players (fixed rules, the same for everyone):
;   enemy durability, damage and speed: as with 4 players (5-8 players add nothing);
;   only the enemy counts below grow with the team.
; 1 = enemy counts grow with 5-8 players: x1.2, x1.4, x1.6, x1.8, rounded (a count of 1 stays 1 up to
;     6 players). Nests, anchors, ships, pods, eggs and other fixed objects never multiply; enemies a
;     mission places one at a time are not duplicated yet.
; 0 = counts as with 4 players. Everyone in a room must use the same setting.
ExtraEnemies=1

[CopyArmor]
; F4 or the left stick, in a room, turns "copy armor" on and off. While it is on, your armor follows the
; lowest armor among the other members of the room: of your own class if anyone else plays it, otherwise of
; the whole room. It only ever raises your armor, never lowers it, and it follows along when anyone changes
; class. Meant for someone who has just started, or for a class they have not levelled, so they are not
; fragile in a group.
; Nothing is written to your save, and the room keeps showing your real armor to you and to everyone else -
; only the mission gets the raised one. The menu's lower left says what you are being given, e.g.
; "F4/LS copy armor :2500(Max)". Turning it off, or leaving the room, puts everything back.
; 0 = the feature is not installed at all (the game's armor code is left completely untouched).
Enabled=1
; It works inside a room, where the page inputs also work, so it may be neither of those, nor F2.
; F1..F24, Tab, a virtual-key number, or None. F5, F9, F11 and F12 are used by EDF6VR; F4 is one of its
; development keys, free while its DevKeys=0.
Key=F4
; And the pad button, so a VR controller can reach it: the stick the page button does not use.
; RightStick, LeftStick, Back, Start, X, Y, LB, RB, LT, RT or None.
PadButton=LeftStick
; How close another member's armor has to be to yours for them to be passed over. Copying someone barely
; different is no help, so the next one up is taken instead: with 3000, 2000, 300 and 200 in the room, the
; 300 and the 200 both reach past each other and copy the 2000. 0 = only pass over exactly equal armor.
IgnoreWithin=300
; The most this may give, per class. It is a rescue for someone who is behind, not a way to someone else's
; armor: a copy above the ceiling is held down to it, and the menu says "(Max)" when that happens.
; 0 = no ceiling for that class.
MaxRanger=4000
MaxWingDiver=2500
MaxAirRaider=3000
MaxFencer=4000

[Test]
; Solo test for missions with more than four players (needs Extend=1): when you start a mission
; alone in your own online room, this many idle copies of you join as extra players (0..7).
; Nothing is sent to anyone. 0 = off.
GhostPlayers=0
